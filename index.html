<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopix Store</title>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>
body { font-family: Arial; background:#0f172a; color:white; text-align:center; }
button { padding:10px; margin:5px; border:none; border-radius:8px; background:orange; }
.card { background:#1e293b; margin:10px; padding:10px; border-radius:10px; }
img { width:100%; border-radius:10px; }
input, textarea { padding:10px; margin:5px; border-radius:8px; width:80%; }
</style>
</head>

<body>

<h1>🛒 Shopix Store</h1>

<button onclick="viewCart()">🛍 Cart (<span id="cartCount">0</span>)</button>

<div id="products"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// 🔥 Firebase config (same as admin)
const firebaseConfig = {
  apiKey: "AIzaSyBa2yg_3UYg43uFmaSCH-VKiXXN7f5WBGg",
  authDomain: "shopix-ec11c.firebaseapp.com",
  projectId: "shopix-ec11c",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🛍 LOAD PRODUCTS (AUTO)
async function loadProducts() {
  const snap = await getDocs(collection(db,"products"));
  products.innerHTML = "";

  snap.forEach(doc=>{
    const p = doc.data();
    products.innerHTML += `
      <div class="card">
        <img src="${p.image}">
        <h3>${p.name}</h3>
        ₹${p.price}<br>
        <button onclick="addToCart('${p.name}','${p.price}','${p.image}')">Add to Cart</button>
      </div>
    `;
  });
}

// 🛒 CART
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function updateCart(){
  document.getElementById("cartCount").innerText = cart.length;
}
updateCart();

window.addToCart = function(name,price,image){
  cart.push({name,price,image});
  localStorage.setItem("cart",JSON.stringify(cart));
  updateCart();
  alert("Added to Cart");
};

// 🛒 CHECKOUT
window.viewCart = function(){
  let total=0, items="";
  
  cart.forEach(i=>{
    total+=Number(i.price);
    items+=`${i.name} - ₹${i.price}<br>`;
  });

  document.body.innerHTML=`
    <h2>🧾 Checkout</h2>

    ${items}
    <h3>Total ₹${total}</h3>

    <input id="custName" placeholder="Full Name"><br>
    <input id="custPhone" placeholder="Mobile Number"><br>
    <textarea id="custAddress" placeholder="Full Address"></textarea><br>

    <button onclick="pay(${total})">💳 Pay Now</button>
    <br><br>
    <button onclick="location.reload()">⬅ Back</button>
  `;
};

// 💳 PAYMENT
window.pay = function(amount){

  const name = document.getElementById("custName").value;
  const phone = document.getElementById("custPhone").value;
  const address = document.getElementById("custAddress").value;

  if(!name || !phone || !address){
    return alert("Fill all details");
  }

  var options = {
    key: "YOUR_RAZORPAY_KEY",
    amount: amount*100,
    currency: "INR",
    name: "Shopix",

    handler: async function (response){
      
      await addDoc(collection(db,"orders"),{
        paymentId: response.razorpay_payment_id,
        customerName: name,
        phone: phone,
        address: address,
        items: cart,
        total: amount,
        status: "paid",
        time: new Date()
      });

      alert("Order Placed ✅");

      localStorage.removeItem("cart");
      location.reload();
    }
  };

  var rzp = new Razorpay(options);
  rzp.open();
};

// 🚀 AUTO LOAD
loadProducts();

</script>

</body>
  </html>
